name: imos_atf-sattag_dive_schema
type: table
path: dive_tu123_nrt.csv
scheme: file
format: csv
mediatype: text/csv
encoding: utf-8
dialect:
  header: true
  delimiter: ","
  quoteChar: '"'
  skipInitialSpace: false
  lineTerminator: "\n"
  caseSensitiveHeader: false
schema:
  missingValues:
    - ''
    - ' '
    - 'NA'
  fields:
    - name: ref
      type: string
      constraints:
        required: true
    - name: ptt
      type: integer
      constraints:
        required: true
    - name: cnt
      type: integer
      constraints:
        required: true
    - name: de_date
      type: datetime
      format: "%Y-%m-%dT%H:%M:%SZ"
      constraints:
        required: true
    - name: surf_dur
      type: integer
      constraints:
        required: true
    - name: dive_dur
      type: integer
      constraints:
        required: true
    - name: max_dep
      type: number
      constraints:
        required: true
        minimum: 0
    - name: d1
      type: integer
    - name: d2
      type: integer
    - name: d3
      type: integer
    - name: d4
      type: integer
    - name: v1
      type: integer
    - name: v2
      type: integer
    - name: v3
      type: integer
    - name: v4
      type: integer
    - name: v5
      type: integer
    - name: travel_r
      type: number
    - name: homedist
      type: number
    - name: bottom
      type: number
    - name: t1
      type: number
    - name: t2
      type: number
    - name: t3
      type: number
    - name: t4
      type: number
    - name: d_speed
      type: number
      constraints:
        minimum: 0
    - name: n_depths
      type: integer
      constraints:
        minimum: 0
    - name: n_speeds
      type: integer
      constraints:
        minimum: 0
    - name: depth_str
      type: string
      constraints:
        pattern: '^\s*-?\d+(?:\.\d+)?(,\s*-?\d+(?:\.\d+)?)*$' # allows a list of float + allow spaces in front of the float
    - name: speed_str
      type: string
      constraints:
        pattern: '^\s*-?\d+(?:\.\d+)?(,\s*-?\d+(?:\.\d+)?)*$'
    - name: propn_str
      type: string
      constraints:
        pattern: '^\s*-?\d+(?:\.\d+)?(,\s*-?\d+(?:\.\d+)?)*$'
    - name: percent_area
