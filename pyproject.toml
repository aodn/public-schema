[project]
name = "public-schema"
dynamic = ["version"]
description = "IMOS public schema definitions and validation utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "frictionless>=5",
    "pyyaml>=6",
    "requests>=2",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=7",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/public_schema"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]

