# Run sheet for CPR data processing

source_tables:
  - cpr_samp
  - cpr_phyto_raw
  - cpr_phyto_changelog
  - cpr_zoop_raw
  - cpr_zoop_changelog
  - phytoinfo
  - zoopinfo

transforms:
  - name: cpr_phytoplankton_map
    depends:
      - cpr_samp
      - cpr_phyto_raw
  - name: cpr_phytoplankton_abundance_raw_data
    depends:
      - cpr_phyto_raw
      - cpr_phytoplankton_map
  - name: cpr_phytoplankton_abundance_species_data
    depends:
      - cpr_phyto_raw
      - cpr_phyto_changelog
      - cpr_phytoplankton_map
  - name: cpr_phytoplankton_abundance_genus_data
    depends:
      - cpr_phyto_raw
      - cpr_phyto_changelog
      - cpr_phytoplankton_map
  - name: cpr_phytoplankton_abundance_htg_data
    depends:
      - cpr_phyto_raw
      - cpr_phytoplankton_map
  - name: cpr_zooplankton_map
    depends:
      - cpr_samp
      - cpr_zoop_raw
  - name: cpr_zooplankton_abundance_raw_data
    depends:
      - cpr_zoop_raw
      - cpr_zooplankton_map
  - name: cpr_zooplankton_abundance_genus_data
    depends:
      - cpr_zoop_raw
      - cpr_zoop_changelog
      - cpr_zooplankton_map
  - name: cpr_zooplankton_abundance_htg_data
    depends:
      - cpr_zoop_raw
      - cpr_zooplankton_map
  - name: cpr_zooplankton_abundance_copepods_data
    depends:
      - cpr_zoop_raw
      - cpr_zoop_changelog
      - cpr_zooplankton_map
  - name: cpr_zooplankton_abundance_non_copepods_data
    depends:
      - cpr_zoop_raw
      - cpr_zoop_changelog
      - cpr_zooplankton_map
  - name: cpr_phytoplankton_biovolume_raw_data
    depends:
      - cpr_phyto_raw
      - cpr_phytoplankton_map
  - name: cpr_phytoplankton_biovolume_species_data
    depends:
      - cpr_phyto_raw
      - cpr_phyto_changelog
      - cpr_phytoplankton_map
  - name: cpr_phytoplankton_biovolume_genus_data
    depends:
      - cpr_phyto_raw
      - cpr_phyto_changelog
      - cpr_phytoplankton_map
  - name: cpr_phytoplankton_biovolume_htg_data
    depends:
      - cpr_phyto_raw
      - cpr_phytoplankton_map
  - name: cpr_derived_indices_data
    depends:
      - zoopinfo
      - cpr_zoop_raw
      - cpr_phyto_raw
